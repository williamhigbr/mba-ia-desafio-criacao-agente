[project]
name = "aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora, construído com Google ADK e exposto por uma API FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "google-adk==2.11.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# O pacote fica em ./aurora (sem layout src/).
module-name = "aurora"
module-root = ""
